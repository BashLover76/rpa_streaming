<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Crunchyroll Token Helper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        min-width: 420px;
        margin: 16px;
        color: #1f2328;
      }
      textarea {
        width: 100%;
        min-height: 96px;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      button {
        margin-top: 8px;
        padding: 8px 10px;
      }
      .meta {
        color: #59636e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Crunchyroll Token Helper</h1>
    <p class="meta" id="status">Recherche du header capture...</p>
    <textarea id="token" readonly></textarea>
    <button id="copy">Copier</button>
    <script src="popup.js"></script>
  </body>
</html>
