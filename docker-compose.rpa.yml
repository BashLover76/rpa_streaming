services:
  rpa-job:
    image: ${STREAMING_RPA_IMAGE:-rpa-streaming-rpa}:${STREAMING_RPA_TAG:-0.3.0}
    build:
      context: .
      dockerfile: Dockerfile.rpa
    environment:
      STREAMING_DB_PATH: /data/streaming.db
      RPA_CDP_URL: ${RPA_CDP_URL_DOCKER:-http://host.docker.internal:9222}
      RPA_CDP_PROXY: ${RPA_CDP_PROXY:-1}
      RPA_CDP_PROXY_PORT: ${RPA_CDP_PROXY_PORT:-9222}
      RPA_CDP_PROXY_TARGET: ${RPA_CDP_PROXY_TARGET:-host.docker.internal:9222}
      RPA_OLLAMA_PROXY: ${RPA_OLLAMA_PROXY:-1}
      RPA_OLLAMA_PROXY_PORT: ${RPA_OLLAMA_PROXY_PORT:-11434}
      RPA_OLLAMA_PROXY_TARGET: ${RPA_OLLAMA_PROXY_TARGET:-host.docker.internal:11434}
      PLATFORM_CONFIG_PATH: ${PLATFORM_CONFIG_PATH:-}
      BETASERIES_API_KEY: ${BETASERIES_API_KEY:-}
      BETASERIES_CLIENT_SECRET: ${BETASERIES_CLIENT_SECRET:-}
      BETASERIES_ACCESS_TOKEN: ${BETASERIES_ACCESS_TOKEN:-}
      BETASERIES_USER_ID: ${BETASERIES_USER_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      CRUNCHYROLL_AUTHORIZATION: ${CRUNCHYROLL_AUTHORIZATION:-}
      CRUNCHYROLL_EMAIL: ${CRUNCHYROLL_EMAIL:-}
      CRUNCHYROLL_PASSWORD: ${CRUNCHYROLL_PASSWORD:-}
      CRUNCHYROLL_LOCALE: ${CRUNCHYROLL_LOCALE:-}
      CRUNCHYROLL_PROFILE_ID: ${CRUNCHYROLL_PROFILE_ID:-}
      CRUNCHYROLL_PROFILE_NAME: ${CRUNCHYROLL_PROFILE_NAME:-}
      NETFLIX_EMAIL: ${NETFLIX_EMAIL:-}
      NETFLIX_PASSWORD: ${NETFLIX_PASSWORD:-}
      NETFLIX_PROFILE_NAME: ${NETFLIX_PROFILE_NAME:-}
      PRIME_VIDEO_EMAIL: ${PRIME_VIDEO_EMAIL:-}
      PRIME_VIDEO_PASSWORD: ${PRIME_VIDEO_PASSWORD:-}
      PRIME_VIDEO_PROFILE_NAME: ${PRIME_VIDEO_PROFILE_NAME:-}
      DISNEY_PLUS_EMAIL: ${DISNEY_PLUS_EMAIL:-}
      DISNEY_PLUS_PASSWORD: ${DISNEY_PLUS_PASSWORD:-}
      DISNEY_PLUS_PROFILE_NAME: ${DISNEY_PLUS_PROFILE_NAME:-}
      CANAL_PLUS_EMAIL: ${CANAL_PLUS_EMAIL:-}
      CANAL_PLUS_PASSWORD: ${CANAL_PLUS_PASSWORD:-}
      CANAL_PLUS_PROFILE_NAME: ${CANAL_PLUS_PROFILE_NAME:-}
      APPLE_TV_EMAIL: ${APPLE_TV_EMAIL:-}
      APPLE_TV_PASSWORD: ${APPLE_TV_PASSWORD:-}
      APPLE_TV_PROFILE_NAME: ${APPLE_TV_PROFILE_NAME:-}
      MAX_EMAIL: ${MAX_EMAIL:-}
      MAX_PASSWORD: ${MAX_PASSWORD:-}
      MAX_PROFILE_NAME: ${MAX_PROFILE_NAME:-}
      PARAMOUNT_PLUS_EMAIL: ${PARAMOUNT_PLUS_EMAIL:-}
      PARAMOUNT_PLUS_PASSWORD: ${PARAMOUNT_PLUS_PASSWORD:-}
      PARAMOUNT_PLUS_PROFILE_NAME: ${PARAMOUNT_PLUS_PROFILE_NAME:-}
      OCS_EMAIL: ${OCS_EMAIL:-}
      OCS_PASSWORD: ${OCS_PASSWORD:-}
      OCS_PROFILE_NAME: ${OCS_PROFILE_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - streaming-web-data:/data
      - rpa-state:/app/.continue
      - rpa-logs:/app/logs
      - rpa-artifacts:/app/artifacts
      - rpa-backups:/app/backups

volumes:
  streaming-web-data:
    external: true
    name: rpa_streaming_streaming-web-data
  rpa-state:
  rpa-logs:
  rpa-artifacts:
  rpa-backups:
