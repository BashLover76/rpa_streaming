services:
  rpa-job:
    image: ${STREAMING_RPA_IMAGE:-rpa-streaming-rpa}:${STREAMING_RPA_TAG:-0.3.0}
    build:
      context: .
      dockerfile: Dockerfile.rpa
    env_file:
      - .env
    environment:
      STREAMING_DB_PATH: /data/streaming.db
      RPA_CDP_URL: ${RPA_CDP_URL_DOCKER:-http://host.docker.internal:9222}
      RPA_CDP_PROXY: ${RPA_CDP_PROXY:-1}
      RPA_CDP_PROXY_PORT: ${RPA_CDP_PROXY_PORT:-9222}
      RPA_CDP_PROXY_TARGET: ${RPA_CDP_PROXY_TARGET:-host.docker.internal:9222}
      RPA_OLLAMA_PROXY: ${RPA_OLLAMA_PROXY:-1}
      RPA_OLLAMA_PROXY_PORT: ${RPA_OLLAMA_PROXY_PORT:-11434}
      RPA_OLLAMA_PROXY_TARGET: ${RPA_OLLAMA_PROXY_TARGET:-host.docker.internal:11434}
      PLATFORM_CONFIG_PATH: ${PLATFORM_CONFIG_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - streaming-web-data:/data
      - rpa-state:/app/.continue
      - rpa-logs:/app/logs
      - rpa-artifacts:/app/artifacts
      - rpa-backups:/app/backups
      - ./config:/app/config:ro

volumes:
  streaming-web-data:
    external: true
    name: rpa_streaming_streaming-web-data
  rpa-state:
  rpa-logs:
  rpa-artifacts:
  rpa-backups:
