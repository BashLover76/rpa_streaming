services:
  rpa-job:
    image: ${STREAMING_RPA_IMAGE:-rpa-streaming-rpa}:${STREAMING_RPA_TAG:-0.8.0}
    build:
      context: .
      dockerfile: Dockerfile.rpa
    environment:
      STREAMING_DB_PATH: /data/streaming.db
      BETASERIES_CONFIG_FILE: ${BETASERIES_CONFIG_FILE:-config/betaseries.local.json}
      OLLAMA_CONFIG_FILE: ${OLLAMA_CONFIG_FILE:-config/ollama.local.json}
      CRUNCHYROLL_CONFIG_FILE: ${CRUNCHYROLL_CONFIG_FILE:-config/crunchyroll.local.json}
      STREAMING_PROFILES_FILE: ${STREAMING_PROFILES_FILE:-config/streaming_profiles.local.json}
      STREAMING_PLATFORMS_FILE: ${STREAMING_PLATFORMS_FILE:-config/streaming_platforms.local.json}
      STREAMING_PLATFORM_CONFIG_FILE: ${STREAMING_PLATFORM_CONFIG_FILE:-config/streaming_platform_config.local.json}
      RPA_CDP_URL: ${RPA_CDP_URL_DOCKER:-http://127.0.0.1:9222}
      RPA_CDP_PROXY: ${RPA_CDP_PROXY:-1}
      RPA_CDP_PROXY_PORT: ${RPA_CDP_PROXY_PORT:-9222}
      RPA_CDP_PROXY_TARGET: ${RPA_CDP_PROXY_TARGET:-host.docker.internal:9222}
      RPA_STORAGE_STATE_PATH: ${RPA_STORAGE_STATE_PATH_DOCKER:-/app/.continue/browser-storage-state.json}
      RPA_OLLAMA_PROXY: ${RPA_OLLAMA_PROXY:-1}
      RPA_OLLAMA_PROXY_PORT: ${RPA_OLLAMA_PROXY_PORT:-11434}
      RPA_OLLAMA_PROXY_TARGET: ${RPA_OLLAMA_PROXY_TARGET:-host.docker.internal:11434}
      PLATFORM_CONFIG_PATH: ${PLATFORM_CONFIG_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - streaming-web-data:/data
      - rpa-state:/app/.continue
      - rpa-logs:/app/logs
      - rpa-artifacts:/app/artifacts
      - rpa-backups:/app/backups
      - streaming-web-config:/app/config:ro

volumes:
  streaming-web-data:
    external: true
    name: rpa_streaming_streaming-web-data
  streaming-web-config:
    external: true
    name: rpa_streaming_streaming-web-config
  rpa-state:
  rpa-logs:
  rpa-artifacts:
  rpa-backups:
