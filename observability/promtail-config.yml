server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: rpa_streaming_scripts
    static_configs:
      - targets: [localhost]
        labels:
          job: rpa_streaming
          source: script
          __path__: /var/log/rpa_streaming/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/(?P<script>[^/]+)\.log$'
      - labels:
          script:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?P<level>[A-Z]+) \| (?P<logger>[^|]+) \| (?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'
          location: Europe/Paris

  - job_name: rpa_streaming_platforms
    static_configs:
      - targets: [localhost]
        labels:
          job: rpa_streaming
          source: platform
          __path__: /var/log/rpa_streaming/platforms/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/platforms/(?P<platform>[^/]+)\.log$'
      - labels:
          platform:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?P<level>[A-Z]+) \| (?P<logger>[^|]+) \| (?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'
          location: Europe/Paris
